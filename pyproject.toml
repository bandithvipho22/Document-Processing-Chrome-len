[project]
name = "khmer-ocr"
version = "1.0.0"
description = "Modern full-stack OCR system for extracting text from images and PDFs with support for Khmer language"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "OCR Contributors"}
]
keywords = ["ocr", "khmer", "optical-character-recognition", "pdf", "image-processing", "chromelens"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Multimedia :: Graphics :: Capture",
]
dependencies = [
    "chrome-lens-py",
    "ocrmypdf>=17.3.0",
    "ocrmypdf-chromelens-ocr>=1.0.7",
    "pandas>=3.0.1",
    "pdfplumber>=0.11.9",
    "pymupdf>=1.27.2",
    "tabulate>=0.10.0",
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.30.6",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "gunicorn>=21.0.0",
]

[tool.uv.sources]
chrome-lens-py = { git = "https://github.com/bropines/chrome-lens-py.git" }
